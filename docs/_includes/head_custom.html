{%- comment -%}
  Fishwrap brand head extensions. See docs/BRAND.md §6.2 for the favicon
  spec and §7 for asset production. Loaded by just-the-docs as a head hook.
{%- endcomment -%}

<link rel="icon" type="image/svg+xml" href="{{ '/static/images/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/static/images/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/static/images/favicon-192.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/static/images/favicon-180.png' | relative_url }}">
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Fishwrap">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ '/static/images/og-card.png' | absolute_url }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ '/static/images/og-card.png' | absolute_url }}">
