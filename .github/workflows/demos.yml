# Fishwrap demos refresh workflow.
#
# Runs daily, builds the vanilla reference demo against the published
# image, validates the output's size, and deploys the result to
# fishwrap.org via GitHub Pages.
#
# Two jobs, run sequentially:
#
#   build   pulls the pinned image, runs fishwrap-build, validates the
#           output is at least MIN_OUTPUT_BYTES, uploads the HTML as an
#           artifact.
#
#   deploy  needs: build. Downloads the HTML artifact, slots it into
#           docs/demo/vanilla/, copies theme static assets from the
#           source tree, runs Jekyll on docs/, and deploys via
#           actions/deploy-pages.
#
# Failure modes the 2 AM operator should know about:
#
#   "manifest unknown" on docker pull
#       The pinned image tag (FISHWRAP_IMAGE below) doesn't exist on
#       GHCR. Either v2.0.0 hasn't cut yet, or someone renamed the
#       package. Cut the release or fix the tag.
#
#   "<file> is N bytes, expected at least 10240"
#       The pipeline ran but produced near-empty output. Usually means
#       all feeds 404'd or the printer crashed mid-render. Check the
#       build job's logs.
#
#   Pages deploy step failed
#       Either the Pages source isn't set to "GitHub Actions" in repo
#       settings, or Jekyll choked on a file in docs/. Check the deploy
#       job's logs.

name: demos

on:
  schedule:
    # Daily at 12:00 UTC. Aligns roughly with The Daily Clamour's
    # 04:00 Pacific cadence (will drift one hour during DST; harmless).
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize: never two demo refreshes at once. cancel-in-progress: false
# because we never want to abort a publish midway.
concurrency:
  group: demos
  cancel-in-progress: false

env:
  FISHWRAP_IMAGE: ghcr.io/maxspevack/fishwrap:2.0
  # Smallest plausible size for a healthy demo HTML file. Files smaller
  # than this almost always mean the pipeline produced empty/error output.
  MIN_OUTPUT_BYTES: 10240

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (configs and themes)
        uses: actions/checkout@v6

      - name: Pull pinned fishwrap image
        run: docker pull "$FISHWRAP_IMAGE"

      - name: Run fishwrap-build for vanilla
        run: |
          mkdir -p demo/output demo/data
          # --user $(id -u):$(id -g) makes the container process run as the
          # runner's user (typically uid 1001 on ubuntu-latest), not the
          # image's default fishwrap user (uid 1000). Without this, the
          # bind-mounted /workspace is owned by the runner uid and the
          # container's fishwrap uid can't write to it — sqlite3 fails
          # with "unable to open database file" the moment the engine tries
          # to create demo/data/vanilla.db.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${PWD}:/workspace" \
            --workdir /workspace \
            "$FISHWRAP_IMAGE" \
            fishwrap-build --config "/workspace/demo/config.py"

      - name: Validate output (size gate)
        run: |
          out="demo/output/index.html"
          if [ ! -f "$out" ]; then
            echo "::error::$out was not produced"
            exit 1
          fi
          size=$(stat -c%s "$out")
          if [ "$size" -lt "$MIN_OUTPUT_BYTES" ]; then
            echo "::error::$out is $size bytes, expected at least $MIN_OUTPUT_BYTES"
            exit 1
          fi
          echo "$out: $size bytes — OK"

      - name: Upload demo HTML
        uses: actions/upload-artifact@v7
        with:
          name: demo-vanilla
          path: demo/output/index.html
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source (for docs/ and demo/themes/)
        uses: actions/checkout@v6

      - name: Download demo artifact
        uses: actions/download-artifact@v8
        with:
          name: demo-vanilla
          path: artifacts/demo-vanilla

      - name: Assemble demo page into docs/demo/vanilla/
        run: |
          set -e
          mkdir -p docs/demo/vanilla
          # The artifact contains exactly one HTML file. Copy it as
          # index.html so consumers hit /demo/vanilla/ cleanly.
          find artifacts/demo-vanilla -name '*.html' -print -exec cp {} docs/demo/vanilla/index.html \;
          # Theme static assets travel with the demo.
          mkdir -p docs/demo/vanilla/static
          cp -r demo/themes/basic/static/. docs/demo/vanilla/static/

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
